stages:
  - deploy

publish_image:
  stage: deploy
  image: docker:24.0.5
  services: 
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:latest
  needs:
    - job_build
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - main

    